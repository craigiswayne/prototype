name: Docker Test

on:
  push:
    branches: ["feature/angular"]

permissions:
  contents: write

jobs:
  build_and_tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Repo Name
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Get Latest Tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{github.repository_owner}}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ env.REPO_NAME }}:${{ env.LATEST_TAG }} .

      - name: Tag Docker Images
        run: |
          docker tag ${{ env.REPO_NAME }}:${{ env.VERSION }} ${{github.repository_owner}}/${{ env.REPO_NAME }}:${{ env.LATEST_TAG }}
          docker tag ${{ env.REPO_NAME }}:${{ env.VERSION }} ${{github.repository_owner}}/${{ env.REPO_NAME }}:latest

