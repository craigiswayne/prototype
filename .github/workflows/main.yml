name: Build and Release Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: 'prototype'

permissions:
  contents: write

jobs:
  build_and_containerize:
    runs-on: ubuntu-latest

    outputs:
      new_version: ${{steps.get_version.outputs.version}}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: get_version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "version=${{env.VERSION}}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.APP_NAME }}:${{ env.VERSION }} .
          docker tag ${{ env.APP_NAME }}:${{ env.VERSION }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.VERSION }}

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{env.APP_NAME}}:${{ env.VERSION }}

  release:
    needs: build_and_containerize
    runs-on: ubuntu-latest

    steps:
      - env:
          OUTPUT1: ${{needs.build_and_containerize.outputs.new_version}}
        run: echo "NEW VERSION = $OUTPUT1"

      - name: 'test echos'
        run: "echo ENV VERSION: ${{env.VERSION}}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
