name: Publish to Docker

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_containerize:
    runs-on: ubuntu-latest

    # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/passing-information-between-jobs
    outputs:
      new_version: ${{steps.get_version.outputs.version}}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Repo Name
        run: |
          REPO_NAME=$(basename ${{ github.repository }})
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: get_version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
# TODO maybe save the version into one variable and reference that variable instead of doing the regex again?

#      - name: test_echos
#        run: |
#          echo "version from env = ${{ env.VERSION }}"
#          echo "version from output = ${{ steps.get_version.outputs.VERSION }}"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{github.repository_owner}}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ env.REPO_NAME }}:${{ env.VERSION }} .

      - name: Tag Docker Images
        run: |
          docker tag ${{ env.REPO_NAME }}:${{ env.VERSION }} ${{github.repository_owner}}"/:${{ env.VERSION }}
          docker tag ${{ env.REPO_NAME }}:${{ env.VERSION }} ${{github.repository_owner}}"/${{ env.REPO_NAME }}:latest

      - name: Push Docker Images
        run: |
          docker push ${{github.repository_owner}}/${{ env.REPO_NAME }}:${{ env.VERSION }}
          docker push ${{github.repository_owner}}/${{ env.REPO_NAME }}:latest

      # TODO delete old docker tags that dont match any of the git-tags
      # This is dangerous, so be sure you want to do it, cause it may be the last accessible point of that image

  release:
    needs: build_and_containerize
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
        env:
          VERSION: ${{needs.build_and_containerize.outputs.new_version}}
