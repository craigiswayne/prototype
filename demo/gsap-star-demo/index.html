<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>My Prototype</title>
            <style>body {
    background: black;
    overflow: hidden;
}

.sparkle-container {
    position: relative;
    width: 300px;
    height: 300px;
}

.star {
    position: fixed;
    width: 20px;
    height: 20px;
    opacity: 0;
    user-select: none;
}</style>
            <script>function createStarEffect(x, y) {
    const container = document.querySelector('.sparkle-container');
    const numStars = 8; // Number of sparkles per effect
    for (let i = 0; i < numStars; i++) {
        const star = document.createElement('img');
        star.src="https://as2.ftcdn.net/v2/jpg/05/40/09/17/1000_F_540091788_AvDyNUSbtnKQfNccukuFa3ZlsHFnMYrK.webp";
        star.classList.add('star');
        container.appendChild(star);

        // Random offset positions
        const angle = Math.random() * Math.PI * 2;
        const radius = 50 + Math.random() * 50; // Random distance from center
        const endX = x + Math.cos(angle) * radius;
        const endY = y + Math.sin(angle) * radius;
        const scale = 0.5 + Math.random(); // Random scaling

        gsap.fromTo(star,
            {
                x: x,
                y: y,
                scale: 0.2,
                opacity: 1,
                rotation: Math.random() * 360
            },

            {
                x: endX,
                y: endY,
                scale: scale,
                opacity: 0,
                rotation: "+=180",
                duration: 1 + Math.random() * 0.5,
                ease: "power2.out",
                onComplete: () => star.remove()
            }
        );
    }
}

// Trigger sparkle effect on mouse click
document.addEventListener("click", mouse_event => {
    console.log(mouse_event);
    createStarEffect(mouse_event.x, mouse_event.y);
});</script>
        </head>
        <body>
           <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<div class="sparkle-container"></div>
        </body>
    </html>
