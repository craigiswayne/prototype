<script>
  function setup_game_board() {
      // for(let column_index = 0; column_index < config.grid.columns; column_index++) {
      for(let column_index = 0; column_index < 1; column_index++) {
          // for(let row_index = 0; row_index < (config.grid.rows+1); row_index++) {
          for(let row_index = 0; row_index < 1; row_index++) {
              const tile = new Tile(column_index, row_index);
              game_board.appendChild(tile);
          }
      }
  }

  function trigger_spin() {
      api_call()
      document.querySelectorAll('.tile').forEach((tile, index) => {
          const column = parseInt((index/config.grid.columns).toString())
          setTimeout(async () => {
              while(!api_request_finished) {
                  await spin(tile)
              }
          }, column * config.spin.column_delay_ms)
      })
  }

  async function spin(tile){
      return new Promise(resolve => {
          const current_y_coordinate = get_y_coordinate(tile)
          let new_y_coordinate = current_y_coordinate + config.spin.increment_pixels;
          if(current_y_coordinate >= (config.grid.rows * config.tile_size)){
              new_y_coordinate = -1 * config.tile_size
          }
          tile.style.top = new_y_coordinate + 'px';
          setTimeout(resolve, 0.1);
      });
  }
</script>
