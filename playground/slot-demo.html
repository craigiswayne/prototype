<link rel="stylesheet" href="core.css"/>
<script src="core.js" defer></script>
<main>
  <section id="game_board"></section>
</main>
<aside>
  <button onclick="spin()">SPIN</button>
  <button onclick="stop()">STOP</button>
  <fieldset>
    <legend>STOP style</legend>
    <select id="dd_stop">
      <option value="">NONE</option>
      <option value="bounce">BOUNCE</option>
      <option value="cubic-bezier">CUBIC-BEZIER</option>
      <option value="ease">EASE</option>
      <option value="ease-in">EASE IN</option>
      <option value="ease-in-out">EASE IN OUT</option>
      <option value="emphasized">EMPHASIZED</option>
      <option value="jump-both">JUMP BOTH</option>
      <option value="jump-end">JUMP END</option>
      <option value="jump-none">JUMP NONE</option>
      <option value="jump-start">JUMP START</option>
      <option value="slam" selected>SLAM</option>
      <option value="step-start">STEP START</option>
      <option value="step-end">STEP END</option>
      <option value="steps">STEPS</option>
    </select>
  </fieldset>

  <section id="info">
    <div>
      <ol>
        <li><input type="checkbox" checked/>only 2 extra row invisible rows</li>
        <li><input type="checkbox" checked/>spins indefinitely</li>
        <li><input type="checkbox" checked/>tiles move independently</li>
        <li><input type="checkbox" checked/>slam stop</li>
        <li>TODO: increase speed</li>
        <li>TODO: pay lines</li>
        <li>TODO: tile highlighting</li>
        <li>TODO: bouncy stop</li>
      </ol>
    </div>
    <fieldset>
      <legend>logs</legend>
      <div id="logs"></div>
    </fieldset>
  </section>
</aside>

<script>
  function setup_game_board() {
    log(JSON.stringify(config))
    for(let column_index = 0; column_index < config.grid.columns; column_index++) {
      const reel = new Reel();
      for (let row_index = 0; row_index < (config.grid.rows + config.grid.invisible_rows); row_index++) {
        const tile = new Tile(column_index, row_index);
        reel.appendChild(tile);
      }
      game_board.appendChild(reel)
    }
  }

  function spin() {
    api_call()
    Array(config.grid.columns).fill(0).forEach((zero, reel_index) => {
      spin_reel(reel_index)
    })
  }

  async function spin_reel(reel_index){
    await new Promise((resolve) => {
      setTimeout(() => {
        resolve()
      }, reel_index * config.spin.column_delay_ms)
    })
    const targeted_reel = document.querySelectorAll('.reel')[reel_index];
    const promises = [];
    while(!api_request_finished){
      promises.push(move_tile_down(targeted_reel.querySelector('.tile:nth-child(6n+1)')))
      promises.push(move_tile_down(targeted_reel.querySelector('.tile:nth-child(6n+2)')))
      promises.push(move_tile_down(targeted_reel.querySelector('.tile:nth-child(6n+3)')))
      promises.push(move_tile_down(targeted_reel.querySelector('.tile:nth-child(6n+4)')))
      promises.push(move_tile_down(targeted_reel.querySelector('.tile:nth-child(6n+5)')))
      promises.push(move_tile_down(targeted_reel.querySelector('.tile:nth-child(6n+6)')))
      await Promise.all(promises)
    }
  }

  async function move_tile_down(tile) {
    return new Promise(resolve => {
      tile.ontransitionend = resolve
      let current_row_index = parseInt(tile.getAttribute('row'));
      const next_row_index = current_row_index === 6 ? 1 : current_row_index + 1;

      tile.setAttribute('row', next_row_index)

      // Ensures that this tile is in front of tiles moving back up to the top of the reel
      tile.style.zIndex = next_row_index

      tile.style.top = y_coordinate_for_row_index(next_row_index)
    });
  }

</script>
