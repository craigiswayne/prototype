<link rel="stylesheet" href="core.css"/>
<script src="core.js" defer></script>
<style>

  @keyframes spin_tile {
    to {
      top: 400px
    }
  }

  .tile {
    animation: spin_tile 5s ease-in-out 3;
    animation-play-state: paused;
  }

  #game_board.spinning .tile {
    animation-play-state: running;
  }

  .tile:nth-child(5n+1) {
    top: calc(-1 * var(--tile-size));
    animation-duration: 5s;
  }

  .tile:nth-child(5n+2) {
    animation-duration: 4s;
  }

  .tile:nth-child(5n+3) {
    animation-duration: 3s
  }

  .tile:nth-child(5n+4) {
    animation-duration: 2s;
  }

  .tile:nth-child(5n+5) {
    animation-duration: 1s;
  }
</style>
<main>
  <section id="game_board"></section>
</main>
<button onclick="trigger_spin()">spin</button>


<section id="info">
  <div>
    <ol>
      <li><input type="checkbox" checked/>only 1 extra row, hidden by overflow</li>
      <li><input type="checkbox" checked/>can spin indefinitely</li>
      <li><input type="checkbox" checked/>tiles move independently</li>
      <li>TODO: increase speed</li>
      <li>TODO: pay lines</li>
      <li>TODO: tile highlighting</li>
      <li>TODO: slam stop</li>
      <li>TODO: gentle stop</li>
      <li>TODO: bouncy stop</li>
      <li>BUG: tile drift</li>
    </ol>
  </div>
  <div id="logs">

  </div>
</section>

<script>
  const notify_me = function(mutationsList, observer) {
    // Use traditional 'for loops' for IE 11
    for(const mutation of mutationsList) {
      if (mutation.type === 'childList') {
        console.log('A child node has been added or removed.');
      }
      else if (mutation.type === 'attributes') {
        console.log('A ' + mutation.attributeName + ' attribute was modified.');
      }
    }
  };

  function setup_game_board() {
    // for(let column_index = 0; column_index < config.grid.columns; column_index++) {
    for (let column_index = 0; column_index < 1; column_index++) {
      var reel = new Reel()
      // for(let row_index = 0; row_index < (config.grid.rows+1); row_index++) {
      for (let row_index = 0; row_index < 5; row_index++) {
        reel.appendChild(new Tile(column_index, row_index))
      }
      game_board.appendChild(reel)
    }

    log('Game Board setup')
    log(JSON.stringify(config))

    const observer = new MutationObserver(notify_me);

    observer.observe(document.querySelector('.tile'), { attributes: true, childList: true, subtree: true });
  }

  async function trigger_spin() {
    document.querySelectorAll('.tile').forEach(tile => {
      tile.addEventListener('animationiteration', () => {
        tile.style.top = '0px'
        log('Animation iteration: ' + tile.id);
      })
      tile.addEventListener('animationend', () => {
        tile.style.top = '-100px'
        log('Animation iteration: ' + tile.id);
      })
    })
    game_board.classList.add('spinning')
    api_call()
  }
</script>
